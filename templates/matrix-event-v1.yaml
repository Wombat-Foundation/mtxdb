# Matrix profile expressed in mtxdb.collection-template/v1.
# See collection-template-v1.yaml for the generic language.
#
# This describes the policy; it does not alter source events. The current CLI
# importer implements the same identity and collection derivation, and retains
# each accepted event as its full JSON object.
format: mtxdb.collection-template/v1
name: matrix-event
version: 1
description: >-
  Lossless archive mapping for Matrix client-server or federation event JSON.

input:
  encoding: json
  framing:
    accepted:
      - jsonl
      - federation-response

record:
  identity:
    pointer: /event_id
    type: string
    required: true
    node_id:
      algorithm: blake3-128
      input: utf8
    rationale: >-
      Matrix event_id is the immutable protocol identity used by prev_events,
      auth_events, federation APIs, and state references.
  payload:
    mode: source
    pointer: /
    rationale: >-
      Preserve the complete received event, including signatures, hashes,
      unsigned data, unknown fields, and protocol extensions.

collection:
  kind: room
  key:
    pointer: /room_id
    type: string
    required: true
    collection_id:
      algorithm: blake3-128
      input: utf8
    override: explicit-collection-id
  display_id:
    pointer: /room_id
    display: source-value

metadata:
  persistence: collection-sidecar
  fields:
    kind:
      value: room
    room_id:
      source: collection.display_id
    origin_domain:
      source: collection.display_id
      transform: matrix-room-id-server-name
    room_version:
      source: primordial:/content/room_version
      default: "1"
    creator:
      source: primordial:/sender
    additional_creators:
      source: primordial:/content/additional_creators
      default: []

primordial:
  required_for_collection_creation: true
  allow_existing_collection_metadata: true
  selector:
    /type: m.room.create
    /state_key: ""
  membership:
    any_of:
      - record_key_equals_collection_key: true
      - referenced_by: /auth_events
  uniqueness: exactly-one
  reject_collection_if_missing: true
  rationale: >-
    The create event establishes the room version and creator set. Matrix v12
    create PDUs may omit room_id, so they are associated through auth_events.

extensions:
  matrix:
    # This is an immutable collection binding, not a generic-template field.
    room_version:
      source: primordial:/content/room_version
      default: "1"
      policy: mtxdb-core::MatrixRoomVersion
    # The Rust policy supplies the versioned Matrix rules: v1–v2 assigned IDs;
    # v3 standard Base64 reference hashes; v4+ URL-safe hashes; canonical
    # numbers from v6; versioned redaction; and v12 room-ID derivation.
    validation_profiles:
      archive: { verify_reference_hash: false, verify_signatures: false }
      verified: { verify_reference_hash: true, verify_signatures: true }
      state-resolution: { evaluate_auth: true, state_resolution: required }

relationships:
  - name: prev-events
    pointer: /prev_events
    reference: matrix-event-id
  - name: auth-events
    pointer: /auth_events
    reference: matrix-event-id

validation:
  on_missing_identity: reject_record
  on_missing_collection: reject_record
  on_invalid_json: reject_record
  report: per-input-summary

# Projection is deliberately not enabled above. A derived-cache template would
# use this shape, with every retained field named explicitly:
#
# record:
#   payload:
#     mode: projection
#     include: [/event_id, /room_id, /type, /sender, /state_key, /content]
