# mtxdb-ffi and mtxdb-wasm deliberately stay out: a workspace member's own
# [profile.*] is ignored (only the workspace root's applies), and
# mtxdb-wasm's release profile (opt-level "z", lto, panic="abort") is
# load-bearing for wasm binary size — folding it in here silently
# discards it. They stay standalone builds, each with their own
# [workspace] table, depending on mtxdb-core via a path dependency.

[package]
name = "mtxdb"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.81"
publish = false

[workspace]
resolver = "2"
members = ["mtxdb-cli", "mtxdb-core"]

# LINTS

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
] }
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Security / robustness concerns
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
# Quality & correctness restrictions
mutex_atomic = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
verbose_file_reads = "warn"

[lib]
path = "src/lib.rs"

[features]
# Opt-in external comparison benchmarks (MDBX + SQLite), see
# DESIGN-open-and-index-persistence.md §2.3. Gated behind a feature so the
# default `cargo bench` / CI never builds or ships either engine; both are
# comparison-only dev dependencies.
#   libmdbx:   wrapped library Apache-2.0 (since v0.13), wrapper crate MPL-2.0
#   rusqlite:  MIT (links the system libsqlite3, itself public domain)
compare-external = ["dep:libmdbx", "dep:rusqlite"]

[dependencies]
# External comparison backends for `benches/compare_external.rs`, optional so
# the default build never touches them (and this package is publish=false,
# so they can never leak into a published artifact either).
#
# rusqlite deliberately omits `bundled`: bundling compiles SQLite's C
# amalgamation from source on every build needing the feature, on top of
# libsqlite3-sys's own bindgen run. Linking the system libsqlite3 (found via
# pkg-config) skips that compile step; it costs requiring sqlite3 dev headers
# to be installed wherever `--features compare-external` is actually used,
# which is fine for an opt-in comparison bench that never ships.
libmdbx = { version = "0.6", optional = true }
mtxdb-core = { path = "mtxdb-core" }
rusqlite = { version = "0.32", optional = true }

[dev-dependencies]
bytes = "1.5"
crc32fast = "1.4"

[lints]
workspace = true

# BENCHES — `benches/storage.rs` is discovered by this root package as well
# as explicitly registered by `mtxdb-core`. Keep its direct shared dependencies
# here so `cargo bench` from the database root works.
#
# Each custom bench has its own `fn main()`, so root-package discovery must
# opt out of Cargo's default libtest harness. The mtxdb-core registrations do
# not apply to `cargo bench --benches` at this workspace root.

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "locality"
harness = false

[[bench]]
name = "compression"
harness = false

# Three-way MDBX / SQLite / mtxdb comparison. Opt-in via
# `--features compare-external`; `required-features` means `cargo bench`
# (and CI) skips it — and never builds libmdbx/rusqlite — unless requested.
[[bench]]
name = "compare_external"
harness = false
required-features = ["compare-external"]

# BUILD PROFILES — must be plain [profile.*], never nested under
# [workspace.*]; Cargo only recognizes profiles at this exact table name
# regardless of whether the manifest is virtual or a real package.

[profile.release]
strip = "symbols"
lto = "thin"

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

[profile.test]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256
