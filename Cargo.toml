[package]
name = "mtxdb"
version.workspace = true
edition = "2021"
rust-version = "1.81"
publish = false
# Without this, Cargo auto-discovers benches/*.rs as this package's own bench
# targets purely by their being physically under benches/ (which is now
# mtxdb-benches's directory, not this package's) -- explicit [[bench]] entries
# aren't the only way in. See the BENCHES comment below.
autobenches = false

repository = "https://github.com/Wombat-Foundation/mtxdb"
description = "mtxdb: write-once, content-addressed packfile storage engine for Matrix"
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
keywords = ["database", "matrix", "packfile", "content-addressed", "hamt"]
categories = ["database-implementations", "storage"]

[workspace]
resolver = "2"
# mtxdb-cli is deliberately *not* a member. Its deps (clap 4.6, simd-json
# 0.18) use edition 2024, which Cargo < 1.85 cannot even parse, and Cargo
# parses every member's graph plus the shared lock for every command -- so a
# member there would drag the whole workspace's floor up to 1.85. Keeping it
# out (like benches/, which has its own `[workspace]` table)
# preserves the library's 1.81 MSRV. Build/lint/test it with
# `--manifest-path mtxdb-cli/Cargo.toml`.
members = []

[workspace.package]
version = "0.1.0-beta.1"

# LINTS

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
] }
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Security / robustness concerns
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
# Quality & correctness restrictions
mutex_atomic = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
verbose_file_reads = "warn"

[lib]
path = "src/lib.rs"

[features]
default = ["zstd"]
# Record-payload compression. On by default, so stores keep writing and reading
# zstd frames; disable (with `default-features = false`) for builds that must
# not carry zstd. A build without it always
# writes raw frames and refuses to read compressed ones.
zstd = ["dep:zstd", "dep:zstd-sys"]

# Cross-process write-ahead journal + read-committed overlay, for a
# single-writer/multi-reader deployment where separate OS processes need to
# read a live writer's committed-but-not-yet-checkpointed data (e.g. a
# Synapse worker deployment). Off by default: a genuinely single-process
# embedded deployment never needs this, and it costs real code (journal.rs,
# the read-journal overlay, the refresh-on-miss read path) that a
# single-process build shouldn't have to carry. See docs/TODO.txt's
# "process model" entries for the deployment-shape reasoning.
multi-reader = []

[dependencies]
arc-swap = "1"
blake3 = "=1.5.5"
bytes = "1.5"
crc32fast = "1.4"
fs2 = "0.4"
memmap2 = "0.9.11"
parking_lot = "0.12"
sha2 = "0.10"
zstd = { version = "0.13", default-features = false, optional = true }

# `zstd`/`zstd-safe` don't forward a "pkg-config"/"vendored" feature of their
# own, so reach `zstd-sys` directly at the same version zstd-safe resolves to
# — Cargo unifies the two into one build. Unix hosts link the system libzstd
# via pkg-config (already installed at /usr/local/lib here) instead of
# compiling zstd's C sources ourselves; Windows has neither pkg-config nor a
# system zstd, so it vendors and builds them with MSVC. zstd-sys lets
# `vendored` win over `pkg-config`, but neither is target-conditional inside
# the crate, so the choice is made here with two cfg tables.
[target.'cfg(not(windows))'.dependencies]
zstd-sys = { version = "2.1", features = ["pkg-config"], optional = true }

[target.'cfg(windows)'.dependencies]
zstd-sys = { version = "2.1", features = ["vendored"], optional = true }

[lints]
workspace = true

# BENCHES live in `benches/`, which is its own standalone crate (see that
# directory's Cargo.toml) outside this `[workspace]`'s `members` -- so
# `--workspace --all-targets
# --all-features` from here never builds, lints, or ships them (nor their
# libmdbx/rusqlite/fjall comparison deps). `cd benches` (or
# `--manifest-path benches/Cargo.toml`) to reach them explicitly.

# BUILD PROFILES — must be plain [profile.*], never nested under
# [workspace.*]; Cargo only recognizes profiles at this exact table name
# regardless of whether the manifest is virtual or a real package.

[profile.release]
strip = "symbols"
lto = "thin"

# Fast compile time with decent runtime performance and full debuginfo.
[profile.release-quick]
debug = "full"
debug-assertions = false
incremental = true
inherits = "release"
lto = "off"
opt-level = 1
strip = "none"

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

# Fast compile-time development/testing profile. "quick" refers to compile
# time, not runtime speed.
[profile.dev-quick]
codegen-units = 256
debug = "line-tables-only"
incremental = true
inherits = "dev"
lto = "off"
opt-level = 0
strip = "symbols"

[profile.test]
inherits = "dev"
