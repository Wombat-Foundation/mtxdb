[workspace]
resolver = "2"
members = ["mtxdb-cli", "mtxdb-core"]
# mtxdb-ffi and mtxdb-wasm deliberately stay out: a workspace member's own
# [profile.*] is ignored (only the workspace root's applies), and
# mtxdb-wasm's release profile (opt-level "z", lto, panic="abort") is
# load-bearing for wasm binary size — folding it in here silently
# discards it. They stay standalone builds, each with their own
# [workspace] table, depending on mtxdb-core via a path dependency.

# LINTS

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
] }
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Security / robustness concerns
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
# Quality & correctness restrictions
mutex_atomic = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
verbose_file_reads = "warn"

# BENCHES — lives in mtxdb-core/Cargo.toml, not here: a virtual manifest
# (this file has no [package]) can't own a [[bench]] target at all.

# BUILD PROFILES — must be plain [profile.*], never nested under
# [workspace.*]; Cargo only recognizes profiles at this exact table name
# regardless of whether the manifest is virtual or a real package.

[profile.release]
strip = "symbols"
lto = "thin"

[profile.release-max-perf]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256

[profile.test]
debug = 0
strip = "debuginfo"
incremental = true
codegen-units = 256
