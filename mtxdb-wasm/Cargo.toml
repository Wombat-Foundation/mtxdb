[package]
name = "mtxdb-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "WebAssembly bindings for mtxdb via wasm-bindgen"
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
repository = "https://github.com/Wombat-Foundation/mtxdb"
readme = "../README.md"
keywords = ["matrix", "wasm", "packfile", "storage"]
categories = ["database-implementations", "wasm"]

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.5"
mtxdb = { path = ".." }
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = ["console"]
