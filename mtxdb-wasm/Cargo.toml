[package]
name = "mtxdb-wasm"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.81"
publish = false

repository = "https://github.com/Wombat-Foundation/mtxdb"
description = "WebAssembly bindings for mtxdb via wasm-bindgen"
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
keywords = ["matrix", "wasm", "packfile", "storage"]
categories = ["database-implementations", "wasm"]
readme = "../README.md"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.5"
mtxdb = { path = ".." }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
