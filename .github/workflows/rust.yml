---
name: PR Checks

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_BACKTRACE: "1"

jobs:
  toolchain-checks:
    name: Rust ${{ matrix.rust }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `rust-toolchain.toml` pins nightly-2026-08-20 and, as a directory
      # override, outranks the `rustup default` the action installs -- so
      # without this every row silently ran the pinned nightly. RUSTUP_TOOLCHAIN
      # has the highest precedence, so matrix.rust actually takes effect.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.81.0"
            label: "MSRV (default features)"
          # The CLI lives in its own workspace (see mtxdb-cli/Cargo.toml): its
          # edition-2024 deps (clap 4.6) and simd-json 0.18 set its floor at
          # 1.88. It cannot share the `toolchain-checks` workspace because
          # Cargo parses every member's graph + the shared lock, which would
          # drag these library rows up to 1.85+ too.
          - rust: "1.88.0"
            label: "cli feature"
          # The cross-process read-committed overlay (`multi-reader`) has its
          # own submodule (`packfile::storage::read_journal`) gated out of the
          # default build entirely, so it needs its own compiled-and-tested
          # row rather than relying on the `all-features` job below to catch
          # a break here -- `--all-features` compiling says nothing about
          # `--no-default-features --features multi-reader` compiling.
          - rust: "1.81.0"
            label: "multi-reader feature"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Toolchain Versions
        run: |
          rustc --version
          cargo --version

      # 1.81.0 is the library's MSRV (enables core::error::Error) and stays
      # reachable only because mtxdb-cli is its own workspace. The `cli
      # feature` row runs at 1.88.0, the CLI's own floor.
      - name: Lint (default features)
        if: matrix.label == 'MSRV (default features)'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test (default features)
        if: matrix.label == 'MSRV (default features)'
        run: cargo test --locked --lib --tests

      - name: Lint (cli feature)
        if: matrix.label == 'cli feature'
        run: cargo clippy --locked --all-targets --manifest-path mtxdb-cli/Cargo.toml -- -D warnings

      - name: Test (cli feature)
        if: matrix.label == 'cli feature'
        run: cargo test --locked --lib --tests

      - name: Build CLI
        if: matrix.label == 'cli feature'
        run: cargo build --release --locked --manifest-path mtxdb-cli/Cargo.toml

      - name: Lint (multi-reader feature)
        if: matrix.label == 'multi-reader feature'
        run: cargo clippy --locked --no-default-features --features multi-reader,zstd --lib --tests -- -D warnings

      - name: Test (multi-reader feature)
        if: matrix.label == 'multi-reader feature'
        run: cargo test --locked --no-default-features --features multi-reader,zstd --lib --tests

  all-features:
    name: Rust ${{ matrix.rust }} all features
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # See toolchain-checks: overrides the committed rust-toolchain.toml pin.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.81.0", "1.82.0", "1.85.0", "1.92.0", "1.98.1", "stable", "nightly"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Toolchain Versions
        run: |
          rustc --version
          cargo --version

      - name: Lint
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-features --lib --tests

  checks:
    name: Format, Coverage, and Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          pip install pre-commit
          npm install -g prettier@3.6.2 markdownlint-cli@0.43.0
          cargo install cargo-sort

      - name: Format Check
        run: make format && git diff --exit-code

      - name: Lint (Clippy)
        run: cargo clippy --locked --all-features --all-targets -- -D warnings

      - name: Install nightly toolchain (for llvm-cov)
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test Suite
        run: set -o pipefail; cargo test --locked --all-features --lib --tests 2>&1 | tee test-results.txt

      - name: Code Coverage
        run: make cov

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.txt

      - name: Test Summary
        if: always()
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' test-results.txt | awk '{s+=$1} END {print s}' || true)
          FAILED=$(grep -oE '[0-9]+ failed' test-results.txt | awk '{s+=$1} END {print s}' || true)
          IGNORED=$(grep -oE '[0-9]+ ignored' test-results.txt | awk '{s+=$1} END {print s}' || true)
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| [v] Passed | ${PASSED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| [x] Failed | ${FAILED:-0} |" >> $GITHUB_STEP_SUMMARY
          echo "| [~] Skipped | ${IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/codecov.json
          fail_ci_if_error: false

  publish-badge:
    needs: [checks, toolchain-checks, all-features]
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results

      - name: Generate and Publish Badge
        run: |
          PASSED=$(grep -oE '[0-9]+ passed' test-results.txt | awk '{s+=$1} END {print s}' || true)
          FAILED=$(grep -oE '[0-9]+ failed' test-results.txt | awk '{s+=$1} END {print s}' || true)
          IGNORED=$(grep -oE '[0-9]+ ignored' test-results.txt | awk '{s+=$1} END {print s}' || true)

          python3 ./scripts/generate_badge.py "${PASSED:-0}" "${FAILED:-0}" "${IGNORED:-0}"

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout --orphan badges
          git rm -rf .
          git add tests.svg
          git commit -m "Update test badge"
          git push -f origin badges --force
