---
name: Platform coverage

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_BACKTRACE: "1"

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26, ubuntu-24.04-arm]
    env:
      # Workflow declares `stable`, but the committed rust-toolchain.toml pin
      # (1.89.0) outranks the installed default; RUSTUP_TOOLCHAIN wins over the
      # file so these runners actually use stable.
      RUSTUP_TOOLCHAIN: stable
      # `.cargo/config.toml` enables the host-native `rustc-wrapper` on every
      # platform, but Windows cannot execute its `.sh` (`%1 is not a valid
      # Win32 application`, os error 193), and Cargo has no OS-conditional
      # `rustc-wrapper`. An empty RUSTC_WRAPPER env overrides the config value,
      # so Windows builds portable while macOS keeps the native/mold wrapper.
      RUSTC_WRAPPER: ${{ matrix.os != 'windows-latest' && '.cargo/cargo-wrapper.sh' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install zstd development files (Linux ARM)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: sudo apt-get update && sudo apt-get install --yes libzstd-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Record and assert architecture and page size (Unix)
        if: runner.os != 'Windows'
        run: |
          arch=$(uname -m)
          pagesize=$(getconf PAGESIZE)
          echo "arch: $arch"
          echo "pagesize: $pagesize"

          if [ "$RUNNER_OS" = macOS ]; then
            case "$arch" in
              arm64) expected=16384 ;;
              x86_64) expected=4096 ;;
              *)
                echo "::error::unexpected macOS architecture: $arch"
                exit 1
                ;;
            esac
            if [ "$pagesize" != "$expected" ]; then
              echo "::error::expected $expected-byte pages on macOS $arch, got $pagesize"
              exit 1
            fi
          fi

          rustc -vV

      - name: Toolchain versions
        run: |
          rustc --version
          cargo --version

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace --all-features --lib --tests

      - name: Install vmtouch (macOS)
        if: runner.os == 'macOS'
        run: brew install vmtouch

      - name: Install vmtouch (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes vmtouch

      - name: Run benchmarks
        if: github.event_name == 'push'
        env:
          # read_plan requires disk-backed scratch storage for cold reads.
          MTXDB_BENCH_ROOT: ${{ runner.temp }}/mtxdb-bench
        shell: bash
        run: |
          set -o pipefail
          cargo bench --locked --manifest-path benches/Cargo.toml --benches --all-targets 2>&1 | tee bench-output.txt

      - name: Upload platform benchmarks
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ matrix.os }}
          path: bench-output.txt

  emulated:
    name: Linux ${{ matrix.arch }} (QEMU userspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ppc64le
            page_size: 4096
          - arch: armv7
            page_size: 4096
          - arch: riscv64
            page_size: 4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # User emulation exercises cross-architecture ABI and page alignment.
      # The index format currently rejects big-endian targets at compile time.
      # These containers still use the host kernel; native 64 KiB testing is separate.
      - uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ubuntu24.04
          # armv7 runs a 32-bit userspace on the host's 64-bit kernel. The
          # workspace filesystem hands out inode numbers that don't fit in
          # 32-bit `ino_t`, so readdir() fails with EOVERFLOW; libgit2 then
          # walks away thinking the pinned rezzy commit does not exist
          # ("revspec ... not found"). A tmpfs has small inode numbers, so
          # keep Cargo's git/registry caches there instead of on the mount.
          dockerRunArgs: --tmpfs /opt/cargo:size=2g
          env: |
            RUSTUP_TOOLCHAIN: stable
            RUSTC_WRAPPER: ""
            CARGO_HOME: /opt/cargo
            QEMU_PAGESIZE: ${{ matrix.page_size }}
            CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          install: |
            apt-get update
            apt-get install -y build-essential curl ca-certificates git pkg-config libzstd-dev
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          run: |
            set -eu
            export PATH="/opt/cargo/bin:$HOME/.cargo/bin:$PATH"
            uname -m
            getconf PAGESIZE
            test "$(getconf PAGESIZE)" = "${{ matrix.page_size }}"
            rustc -vV
            cargo test --locked --all-features --lib --tests
            cargo test --locked --no-default-features --features multi-reader,zstd --lib --tests

  linux-abi:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            packages: gcc-multilib libc6-dev-i386
          - target: x86_64-unknown-linux-musl
            packages: musl-tools
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install target compiler and libc
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.packages }}
      - name: Test target
        run: |
          rustc -vV
          cargo test --locked --target ${{ matrix.target }} --all-features --features zstd-sys/vendored --lib --tests
          cargo test --locked --target ${{ matrix.target }} --no-default-features --features multi-reader,zstd,zstd-sys/vendored --lib --tests

  arm64-64k:
    name: Linux ARM64 real 64 KiB kernel (full-system VM)
    # Disabled for PR/push: GitHub-hosted ARM runners have no /dev/kvm, so the
    # full-system 64 KiB guest runs under TCG and is too slow to run routinely.
    # Run it manually via workflow_dispatch, or move it to a self-hosted 64K
    # ARM runner before enabling it again.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-system-arm qemu-utils qemu-efi-aarch64 cloud-image-utils
      - name: Test under a real 64 KiB kernel
        run: bash .github/scripts/arm64-64k.sh
      - name: Upload guest console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-64k-console
          path: arm64-64k-serial.log
