---
name: Rust Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  equiv-determ:
    runs-on: ubuntu-latest
    env:
    steps:
      - uses: actions/checkout@v4
        with:
          # This job executes pull-request code; do not leave a checkout
          # credential available to it. The test suite does not use docs.
          persist-credentials: false
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release crate
        run: make build

      - name: Run Rust test suite
        run: make test

      - name: Upload E2E Diff on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            *.diff
            *.json
            *.log
            .lake/build/
          retention-days: 5
