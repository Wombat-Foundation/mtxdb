---
name: Rust Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  equiv-determ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # This job executes pull-request code; do not leave a checkout
          # credential available to it. The test suite does not use docs.
          persist-credentials: false
          submodules: false

      - name: Install gcc-multilib (for wasm32-wasip1 32-bit headers)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build release crate
        run: make build

      - name: Run Rust test suite
        run: make test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-artifacts
          path: |
            *.json
            *.log
          retention-days: 5
