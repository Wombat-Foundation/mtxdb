[package]
name = "mtxdb-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false

repository = "https://github.com/Wombat-Foundation/mtxdb"
description = "mtxdb: core components and methods"
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
keywords = ["database", "matrix", "packfile", "content-addressed", "hamt"]
categories = ["database-implementations", "storage"]

[lib]
path = "lib.rs"

[dependencies]
arc-swap = "1"
bytes = "1.5"
crc32fast = "1.4"
memmap2 = "0.9.11"
parking_lot = "0.12"
zstd = { version = "0.13", default-features = false }

# Compile zstd's bundled C source ourselves on every target, pinned to the
# exact version in Cargo.lock, instead of linking whatever libzstd happens
# to be installed on the build machine (that was tried via `zstd-sys`'s
# "pkg-config" feature — see git history). Compressed frame bytes must be
# byte-for-byte identical across independently-built nodes for the same
# input (see the `Record`/`write_record` docs), which only holds within a
# single fixed libzstd build: different nodes' system libzstd packages can
# legitimately differ in version and produce different compressed bytes
# for identical plaintext, breaking that guarantee silently. Vendoring
# means every target — including wasm, which has no system libzstd to
# link against in the first place, via `zstd-sys`'s `wasm-shim` minimal
# libc stubs so `cc` can target wasm32 without a full WASI sysroot —
# compiles the identical C source, so encoder output only ever depends on
# input bytes, not on what's installed on whichever machine built the binary.
zstd-sys = { version = "2.1", features = ["vendored"] }

[[bench]]
name = "storage"
path = "../benches/storage.rs"
harness = false

[[bench]]
name = "locality"
path = "../benches/locality.rs"
harness = false

[lints]
workspace = true
