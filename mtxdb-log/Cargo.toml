[package]
name = "mtxdb-log"
version.workspace = true
edition = "2021"
rust-version = "1.88"
publish = false
description = "Optional tracing macros and compact stderr subscriber for mtxdb crates."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wombat-Foundation/mtxdb"
keywords = ["logging", "tracing"]
categories = ["development-tools::debugging"]

[features]
default = []
logging = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1.44", default-features = false, optional = true }

[lints]
workspace = true
