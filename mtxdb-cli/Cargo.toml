[package]
name = "mtxdb-cli"
version.workspace = true
edition = "2021"
rust-version = "1.81"
publish = false

repository = "https://github.com/Wombat-Foundation/mtxdb"
description = "mtxdb: CLI and core library components; fast Matrix binary DB."
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
keywords = ["database", "matrix", "cli"]
categories = ["database", "cli"]
readme = "../README.md"

[[bin]]
name = "mtxdb"
path = "src/main.rs"

[features]
default = ["completions"]
# Shell-completion script generation. On by default; disable with
# `default-features = false` to drop `clap_complete` from a lean CLI build.
completions = ["dep:clap_complete"]

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
bytes = "1.5"
clap = { version = "=4.6.6", default-features = false, features = ["std", "env", "help", "usage", "error-context", "color"] }
clap_complete = { version = "=4.6.9", optional = true }
hex = "0.4"
mtxdb = { path = ".." }
simd-json = { version = "0.18", default-features = false, features = ["runtime-detection"] }

[dev-dependencies]
rezzy = { git = "https://gitlab.com/gamesguru/rezzy.git", branch = "dev" }

[lints]
workspace = true
