[package]
name = "mtxdb-cli"
version.workspace = true
edition = "2021"
rust-version = "1.81"
publish = false

repository = "https://github.com/Wombat-Foundation/mtxdb"
description = "mtxdb: CLI and core library components; fast Matrix binary DB."
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
keywords = ["database", "matrix", "cli"]
categories = ["database", "cli"]
readme = "../README.md"

[[bin]]
name = "mtxdb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
blake3 = "1"
bytes = "1.5"
clap = { version = "=4.6.6", default-features = false, features = ["std", "env", "help", "usage", "error-context", "color"] }
clap_complete = "=4.6.9"
hex = "0.4"
mtxdb-core = { path = "../mtxdb-core" }
simd-json = { version = "0.18", default-features = false, features = ["runtime-detection"] }

[dev-dependencies]
# rezzy = { path = "../../rezzy" }
rezzy = { git = "https://gitlab.com/gamesguru/rezzy.git", rev = "acff39d752ac7363015e866d800722a8271ac34c" }

[lints]
workspace = true
