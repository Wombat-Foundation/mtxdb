[package]
name = "mtxdb-cli"
version = "0.1.0-beta.3"
edition = "2021"
rust-version = "1.89"

repository = "https://github.com/Wombat-Foundation/mtxdb"
description = "mtxdb: CLI and core library components; fast Matrix binary DB."
license = "MIT OR Apache-2.0"
authors = ["Shane Jaroch <chown_tee@proton.me>"]
keywords = ["database", "matrix", "cli"]
categories = ["database", "command-line-utilities"]
readme = "../README.md"
# Test code is not part of the published surface. The extracted unit-test
# module lives beside its source as `src/test_*.rs`, and integration tests
# under `tests/`; exclude both from the packaged archive. Local `cargo test`
# still compiles them through the out-of-line `mod tests;` declaration.
exclude = ["docs/", "tests/", "src/test_*.rs", "src/**/test_*.rs"]

[lib]
name = "mtxdb_cli"
path = "src/cli.rs"

[[bin]]
name = "mtxdb"
path = "src/main.rs"
# The binary shares the root library's crate name (`mtxdb`). Documenting it
# would write into the same target/doc/mtxdb directory and hit cargo #6313;
# the mtxdb_cli library target carries the CLI documentation instead.
doc = false

[features]
default = ["completions"]
# Shell-completion script generation. On by default; disable with
# `default-features = false` to drop `clap_complete` from a lean CLI build.
completions = ["dep:clap_complete"]

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
bytes = "1.5"
clap = { version = "=4.6.7", default-features = false, features = ["std", "env", "help", "usage", "error-context", "color"] }
clap_complete = { version = "=4.6.11", optional = true }
hex = "0.4"
mimalloc = { version = "0.1.52", default-features = false }
mtxdb = { path = "..", version = "0.1.0-beta.2" }
rezzy = { git = "https://gitlab.com/wombat-foundation/rezzy.git", branch = "dev", version = "0.6.0-rc.1", features = ["signing-consensus"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

# Custom build profiles live in the workspace root manifest. Cargo resolves
# `--profile` against that manifest, so a `[profile.*]` table here would be
# ignored with a warning.

# INTEGRATION TESTS. Ungated files are folded into one `tests/unit/main.rs`
# target so `cargo test` links a single binary for them (see that file's
# header).
[[test]]
name = "unit"
path = "tests/unit/main.rs"

# LINTS — mirrors the root workspace's [workspace.lints]; this crate no
# longer shares that table since it's its own workspace root (same as
# benches/Cargo.toml).
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
    "cfg(tarpaulin)",
] }
elided_lifetimes_in_paths = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
arithmetic_side_effects = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
mutex_atomic = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
tests_outside_test_module = "warn"
verbose_file_reads = "warn"
